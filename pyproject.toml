[project]
name = "credit-scoring-observability"
version = "0.1.0"
description = "Observabilidade contínua, detecção de drift, contratos de dados e governança (LGPD) para um modelo de Credit Scoring — Tech Challenge FIAP MLET Fase 4."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Henrique Borges de Freitas" }]
dependencies = [
    "pandas>=2.2,<3",        # Evidently 0.7 ainda não suporta pandas 3
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "pandera>=0.24",
    "evidently>=0.7.10,<0.8",
    "mlflow>=2.16",
    "prometheus-client>=0.20",
    "pyarrow>=16",
    "joblib>=1.4",
    "jinja2>=3.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_monitor"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
