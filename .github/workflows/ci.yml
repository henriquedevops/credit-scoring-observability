name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests
      - run: ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e . pytest pytest-cov
      # Os testes usam dados sinteticos: nao dependem de download nem de credenciais.
      # O teste de ponta a ponta roda o pipeline inteiro (contrato, drift, Evidently, MLflow).
      - run: pytest --cov=credit_monitor --cov-report=term-missing
